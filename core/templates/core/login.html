{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — ProstatCare Mobile</title>
<link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 7 4-14 2 7h6"/></svg>
    </div>
    <h1>ProstatCare Mobile</h1>
    <p>Entre com seu CPF e senha para continuar</p>

    {% if form.non_field_errors %}
      <p style="color:#D9564C;font-size:12px;margin:0 0 12px;">{{ form.non_field_errors.0 }}</p>
    {% endif %}

    <form method="post" action="">
      {% csrf_token %}
      <div class="field-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        {{ form.username }}
      </div>
      <div class="field-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        {{ form.password }}
      </div>

      <button type="submit" class="btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        Entrar
      </button>
    </form>

    <div class="device-status">
      <span class="pulse-dot"></span> Aguardando leitura do dispositivo…
    </div>
  </div>
</div>
</body>
</html>
